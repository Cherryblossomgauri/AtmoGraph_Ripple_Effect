<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AtmoGraph: Country Network</title>
<style>
  body { margin:0; background:#050a14; font-family: sans-serif; color:#cde; }
  h3 { margin:12px; font-weight:500; font-size:16px; }
  svg { width:100%; height:90vh; display:block; }
  line { stroke:#4a7ea8; }
  text { fill:#cde; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<h3>Country network (supply links)</h3>
<svg id="graph">
  <defs>
    <marker id="arr" viewBox="0 -5 10 10" refX="22" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#7fb3d9"/>
    </marker>
  </defs>
</svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
d3.json("graph.json").then(function (data) {
  const svg = d3.select("#graph");
  const width = svg.node().clientWidth, height = svg.node().clientHeight;

  const degree = {};
  data.links.forEach(l => {
    degree[l.source] = (degree[l.source] || 0) + 1;
    degree[l.target] = (degree[l.target] || 0) + 1;
  });

  const sim = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(width / 2, height / 2));

  const link = svg.append("g").selectAll("line").data(data.links).join("line")
    .attr("stroke-width", d => d.weight)
    .attr("marker-end", "url(#arr)");

  const node = svg.append("g").selectAll("circle").data(data.nodes).join("circle")
    .attr("r", d => 6 + (degree[d.id] || 0) * 2)
    .style("fill", d => d.type === "country" ? "#1ba8ff" : "#ff8a65")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  const label = svg.append("g").selectAll("text").data(data.nodes).join("text")
    .text(d => d.id).attr("dx", 12).attr("dy", 4);

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("cx", d => d.x).attr("cy", d => d.y);
    label.attr("x", d => d.x).attr("y", d => d.y);
  });
});
</script>
</body>
</html>
